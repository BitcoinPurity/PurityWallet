limit_req_zone $binary_remote_addr zone=puritywallet_notifications:1m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name notifications.bitcoinpurity.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/puritywallet-notifications/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name notifications.bitcoinpurity.org;
    ssl_certificate /etc/letsencrypt/live/notifications.bitcoinpurity.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notifications.bitcoinpurity.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128k;
    access_log /var/log/nginx/puritywallet-notifications-access.log;
    error_log /var/log/nginx/puritywallet-notifications-error.log;

    location ~ ^/(majorTomToGroundControl|getTokenConfiguration|setTokenConfiguration|unsubscribe|enqueue|ping)$ {
        limit_req zone=puritywallet_notifications burst=20 nodelay;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
    location / {
        return 404;
    }
}
