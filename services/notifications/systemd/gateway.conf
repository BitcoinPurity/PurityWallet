[Unit]
Wants=puritywallet-notifications@api.service
After=puritywallet-notifications@api.service

[Service]
LoadCredential=
IPAddressDeny=any
IPAddressAllow=localhost
MemoryMax=128M
ExecStart=
ExecStart=/usr/bin/node --max-old-space-size=64 /opt/puritywallet-notifications/deployment/run.mjs gateway
ExecStartPost=/usr/bin/curl --fail --silent --show-error --max-time 2 --retry 10 --retry-delay 1 --retry-connrefused --output /dev/null http://127.0.0.1:3010/ping
