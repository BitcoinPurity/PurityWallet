name: Build Unsigned Release APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  buildReleaseApk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: "0"

      - name: Free disk space (Android build)
        shell: bash
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          docker system prune -af || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          rm -rf ~/.gradle/caches/modules-2/files-2.1 || true
          rm -rf ~/.gradle/caches/build-cache || true
          rm -rf ~/.npm/_cacache ~/.cache || true
          sudo rm -rf /home/runner/work/_temp || true
          df -h

      - name: Specify node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Use specific Java version for sdkmanager to work
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Use gradle caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle', 'android/**/*.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install Node Modules
        run: npm ci --omit=dev --yes

      - name: Generate Build Number based on timestamp
        id: build_number
        run: |
          NEW_BUILD_NUMBER="$(date +%s)"
          echo "NEW_BUILD_NUMBER=$NEW_BUILD_NUMBER" >> $GITHUB_ENV
          echo "build_number=$NEW_BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Build Unsigned APK
        id: build_apk
        shell: bash
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.build_number }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(node <<'NODE'
          const fs = require('node:fs');
          const filename = 'android/app/build.gradle';
          const source = fs.readFileSync(filename, 'utf8');
          fs.writeFileSync(filename, source.replace(/versionCode\s+\d+/, `versionCode ${process.env.BUILD_NUMBER}`));
          console.log(source.match(/versionName\s+"([^"]+)"/)[1]);
          NODE
          )
          mkdir -p android/build-logs
          (cd android && ./gradlew :app:assembleRelease -PpuritywalletInternalTestSigning=false --no-daemon --stacktrace --console=plain) | tee android/build-logs/gradle-build.log
          APK_PATH="android/app/build/outputs/apk/release/PurityWallet-${VERSION_NAME}-${BUILD_NUMBER}-unsigned.apk"
          mv android/app/build/outputs/apk/release/app-release-unsigned.apk "$APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build-logs
          path: |
            fastlane/logs/**/*.log
            android/**/*.log
            android/**/build/**/*.log
            android/**/outputs/logs/**/*.log
            android/**/reports/**/*.log
          if-no-files-found: warn

      - name: Upload APK as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-apk
          path: ${{ steps.build_apk.outputs.apk_path }}
          if-no-files-found: error
